<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <!-- Локальный бэкенд (localStorage) вместо Express+PostgreSQL на GitHub Pages.
       defer: выполняется после разбора HTML и не блокирует первую отрисовку. -->
  <script src="local-backend.js" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <!-- Telegram WebApp: корректная высота окна -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    (function () {
      var lastH = 0;
      function sync() {
        var h = window.visualViewport ? window.visualViewport.height : (window.innerHeight || document.documentElement.clientHeight || window.screen.height || 0);
        if (h > 0 && h !== lastH) { lastH = h; document.documentElement.style.setProperty('--app-height', h + 'px'); }
      }
      sync();
      if (window.visualViewport) window.visualViewport.addEventListener('resize', sync);
      window.addEventListener('resize', sync);
      var tg = window.Telegram && window.Telegram.WebApp;
      if (!tg) return;
      tg.ready();
      tg.expand();
      try { tg.onEvent('viewportChanged', sync); } catch (e) {}
    })();
  </script>

  <title>Платформа</title>
  <meta name="description" content="Платформа Mortis Play — анимационные сериалы: «Багажное возмездие», «Бароны», «Типичные случаи и ситуации». Смотри серии и следи за новыми проектами!" />
  <meta name="robots" content="index,follow" />
  <link rel="icon" href="images/favicon.ico" />
  <meta property="og:title" content="Платформа Mortis Play — анимационные сериалы" />
  <meta property="og:description" content="Анимационные сериалы Mortis Play: «Багажное возмездие» и новые проекты в разработке — «Бароны», «Типичные случаи и ситуации»." />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ru_RU" />
  <!-- Неблокирующая загрузка шрифтов и иконок (ускоряет первую отрисовку) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" media="print" onload="this.media='all'">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </noscript>
  <!-- Предзагрузка соединений для превью и плеера YouTube -->
  <link rel="preconnect" href="https://i.ytimg.com">
  <link rel="preconnect" href="https://www.youtube-nocookie.com">
  <link rel="dns-prefetch" href="https://i.ytimg.com">
  <!-- Лоадер: критические стили инлайн — экран загрузки появляется мгновенно -->
  <style>
    #brLoader { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: #0a0a0a; transition: opacity .45s ease; }
    #brLoader.br-loader--hidden { opacity: 0; pointer-events: none; }
    .br-loader-inner { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
    .br-loader-ring { width: 56px; height: 56px; border-radius: 50%; border: 4px solid rgba(229,9,20,.25); border-top-color: #e50914; animation: brSpin .9s linear infinite; }
    @keyframes brSpin { to { transform: rotate(360deg); } }
    .br-loader-title { font-family: 'Manrope', 'Segoe UI', sans-serif; font-weight: 800; letter-spacing: .12em; font-size: .95rem; color: #fff; text-transform: uppercase; }
    .br-loader-sub { font-family: 'DM Mono', monospace; font-size: .72rem; color: #6d6d6d; letter-spacing: .08em; }
  </style>
  <link rel="stylesheet" href="platform.css?v=2">
</head>
<body>
  <!-- Экран загрузки -->
  <div id="brLoader" aria-hidden="true">
    <div class="br-loader-inner">
      <div class="br-loader-ring"></div>
      <div class="br-loader-title">Платформа</div>
      <div class="br-loader-sub">Загрузка…</div>
    </div>
  </div>

  <!-- Кинематографичный фон: зерно плёнки + виньетка + тёплые огни -->
  <div class="br-bg" aria-hidden="true">
    <div class="br-grain"></div>
    <div class="br-vignette"></div>
    <div class="br-glow br-glow--red"></div>
    <div class="br-glow br-glow--amber"></div>
  </div>

  <!-- Шапка -->
  <header class="br-header">
    <div class="br-header-inner">
      <a class="br-logo" href="index.html">
        <span class="br-logo-avatar">
          <img src="/assets/photo.jpg" alt="Mortis Play" onerror="this.onerror=null;this.src='https://placehold.co/120x120/4f46e5/ffffff?text=M'">
        </span>
        <span class="br-logo-text">
          <span class="br-logo-name">Mortis Play</span>
          <span class="br-logo-sub">Официальный сайт</span>
        </span>
      </a>
      <nav class="br-nav">
        <a href="index.html" class="br-nav-link"><i class="fas fa-home"></i> Главная</a>
      </nav>
    </div>
  </header>

  <main class="br-main">
    <!-- ===== HERO ===== -->
    <section class="br-hero" id="hero">
      <div class="br-hero-bg" id="brHeroBg"></div>
      <div class="br-hero-shade"></div>
      <div class="br-hero-content">
        <!-- Переключатель сериалов платформы -->
        <div class="br-tabs" id="brTabs" role="tablist" aria-label="Сериалы платформы"></div>
        <div class="br-hero-kicker" id="brHeroKicker"><span class="br-dot br-dot--blink"></span></div>
        <h1 class="br-hero-title" id="brHeroTitle"></h1>
        <div class="br-meta" id="brHeroMeta"></div>
        <p class="br-hero-logline" id="brHeroLogline"></p>
        <div class="br-hero-actions">
          <button class="br-btn br-btn--white" id="brWatchTrailerBtn"><i class="fas fa-play"></i> Смотреть трейлер</button>
          <button class="br-btn br-btn--glass" id="brMoreInfoBtn"><i class="fas fa-circle-info"></i> Подробнее</button>
        </div>
      </div>
    </section>

    <!-- ===== О ПРОЕКТЕ ===== -->
    <section class="br-section br-reveal" id="about">
      <div class="br-container">
        <h2 class="br-h2">О проекте</h2>
        <p class="br-lead" id="brAboutLead"></p>
        <div class="br-cards" id="brAboutCards"></div>

        <!-- За кадром: рабочие материалы и проекты в разработке -->
        <div class="br-behind" id="brBehind">
          <h3 class="br-behind-title" id="brBehindTitle"></h3>
          <p class="br-behind-lead" id="brBehindLead"></p>
          <div class="br-gallery" id="brBehindGallery"></div>
        </div>
      </div>
    </section>

    <!-- ===== ТРЕЙЛЕР ===== -->
    <section class="br-section br-reveal" id="trailer">
      <div class="br-container">
        <h2 class="br-h2">Трейлер</h2>
        <article class="br-featured" id="brTrailerCard">
          <div class="br-featured-poster">
            <img id="brTrailerThumb" src="" alt="Трейлер сериала">
            <div class="br-featured-play" id="brTrailerPlay"><i class="fas fa-play"></i></div>
            <div class="br-featured-label" id="brTrailerBadge">Трейлер</div>
          </div>
          <div class="br-featured-body">
            <div class="br-meta">
              <span class="br-meta-year">2026</span>
              <span class="br-meta-age">16+</span>
              <span class="br-meta-season" id="brTrailerDuration">—</span>
            </div>
            <h3 class="br-featured-title" id="brTrailerTitle"></h3>
            <p class="br-featured-desc" id="brTrailerDesc"></p>
            <button class="br-btn br-btn--red" id="brTrailerWatchBtn"><i class="fas fa-play"></i> Смотреть трейлер</button>
          </div>
        </article>
      </div>
    </section>

    <!-- ===== СЕРИИ ===== -->
    <section class="br-section br-reveal" id="episodes">
      <div class="br-container">
        <div class="br-row-head">
          <h2 class="br-h2">Серии</h2>
          <div class="br-row-arrows">
            <button class="br-arrow" id="brRowPrev" aria-label="Назад"><i class="fas fa-chevron-left"></i></button>
            <button class="br-arrow" id="brRowNext" aria-label="Вперёд"><i class="fas fa-chevron-right"></i></button>
          </div>
        </div>
        <div class="br-row" id="brRow">
          <div class="br-track" id="brTrack"></div>
        </div>
        <p class="br-row-note" id="brRowNote">Новые серии появляются здесь — следи за обновлениями!</p>
      </div>
    </section>

  </main>

  <footer class="br-footer">
    <p>© <span id="brYear"></span> MortisPlay_Studio · Все права защищены </p>
  </footer>

  <!-- Модалка «Подробнее» -->
  <div class="br-modal" id="brDetailsModal" aria-hidden="true">
    <div class="br-modal-backdrop" data-br-close="details"></div>
    <div class="br-modal-panel">
      <button class="br-modal-close" data-br-close="details" aria-label="Закрыть"><i class="fas fa-times"></i></button>
      <h2 id="brDetailsTitle"></h2>
      <p id="brDetailsText"></p>
      <button class="br-btn br-btn--white" data-br-close="details">Понятно</button>
    </div>
  </div>

  <!-- Киноплеер -->
  <div class="br-player-modal" id="brPlayerModal" aria-hidden="true">
    <div class="br-player-letterbox" id="brPlayerLetterbox">
      <div class="br-player-frame">
        <iframe id="brPlayerIframe" src="" title="Плеер платформы Mortis Play" frameborder="0" allow="fullscreen; accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </div>
      <div class="br-player-bar">
        <div class="br-player-info">
          <span class="br-player-title" id="brPlayerTitle">Сериал</span>
          <span class="br-player-status" id="brPlayerStatus">Сейчас запустится видео…</span>
        </div>
      </div>
      <button class="br-player-close" id="brPlayerClose" aria-label="Закрыть плеер"><i class="fas fa-times"></i></button>
    </div>
  </div>

  <!-- Уведомления -->
  <div class="br-toasts" id="brToasts"></div>

  <script src="platform.js?v=2" defer></script>
</body>
</html>
