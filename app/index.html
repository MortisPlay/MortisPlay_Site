<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=../index.html" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mortis Play — ALPHA</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #f8fafc;
        font-family: Arial, Helvetica, sans-serif;
      }
      .box {
        text-align: center;
        padding: 32px 24px;
        border-radius: 20px;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.35);
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.45);
      }
      .badge {
        display: inline-block;
        margin-bottom: 12px;
        padding: 6px 12px;
        border-radius: 999px;
        background: linear-gradient(135deg, rgba(251,146,60,0.2), rgba(239,68,68,0.18));
        border: 1px solid rgba(251,146,60,0.8);
        color: #fbbf24;
        font-size: 11px;
        letter-spacing: 0.25em;
        font-weight: 800;
        text-transform: uppercase;
      }
      a {
        color: #7dd3fc;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="badge">ALPHA</div>
      <h1>Перенаправление на основную страницу</h1>
      <p>Если вы не были перенаправлены автоматически, нажмите <a href="../index.html">сюда</a>.</p>
    </div>
    <script>
      window.location.replace('../index.html');
    </script>
  </body>
</html>
